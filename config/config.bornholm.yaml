run:
  name: all
  scenarios:
    enable: true
    file: config/scenarios_bornholm.yaml
foresight: overnight
planning_horizons:
- 2035
sector:
  enabled: false
clustering:
  cluster_network:
    n_clusters: 90
  temporal:
    averaging: 3h
energy_islands:
  enabled: false
  case: hybrid
  hubs: data/energy_islands/bornholm_hubs.csv
  wind: data/energy_islands/bornholm_wind.csv
  links: data/energy_islands/bornholm_links.csv
  subtract_generic_potential: true
  length_factor: 1.25
  # Explicit IDs/MW from a reviewed regional-resource allocation.
  # Example syntax only: BEI_WIND: {"ACTUAL_GENERIC_GENERATOR_ID": 3000}
  potential_allocation: {}
  # Required when mapped overlap is less than 3000 MW, including zero.
  potential_allocation_notes: {}
solving:
  solver:
    name: highs
    options: highs-default

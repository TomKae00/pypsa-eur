# Full Bornholm study: native bidding zones, default weather/load inputs, 2035 sectors.
# This study compares Bornholm scenarios with each other, independently of hindcast.
run:
  name: all
  scenarios:
    enable: true
    file: config/scenarios_bornholm.yaml
  shared_resources:
    policy: false
countries: [AL, AT, BA, BE, BG, CH, CZ, DE, DK, EE, ES, FI, FR, GB, GR, HR, HU, IE, IT, LT, LU, LV, ME, MK, NL, 'NO', PL, PT, RO, RS, SE, SI, SK, XK]
foresight: overnight
planning_horizons:
- 2035
snapshots:
  # Native defaults from this checkout's config.default.yaml.
  start: '2013-01-01'
  end: '2014-01-01'
  inclusive: left
enable:
  drop_leap_day: true
data:
  osm:
    source: archive
    version: '0.7'
  costs:
    source: archive
    version: v0.15.0
  cutout:
    source: archive
    version: latest
atlite:
  nprocesses: 4
  default_cutout: europe-2013-sarah3-era5
sector:
  enabled: true
  transport: true
  heating: true
  biomass: true
  industry: true
  shipping: false
  aviation: false
  agriculture: true
  # Fixed background pipelines in every case; local hydrogen remains endogenous.
  H2_network: false
  H2_retrofit: false
  gas_network: true
  gas_network_connectivity_upgrade: 0
  electricity_transmission_grid: true
  # Keep the native sector loss formulation, including the project export links.
  transmission_efficiency:
    enable: [DC, H2 pipeline, H2 pipeline retrofitted, gas pipeline, electricity distribution grid]
pypsa_eur:
  # Native sector cleanup must preserve the DE-LU and IE-NI market connections.
  Link: [DC, copper]
load:
  fixed_year: false
  scaling_factor: 1.0
energy:
  # Native statistical base year; independent of the weather/planning years.
  energy_totals_year: 2023
electricity:
  transmission_limit: vfixed
  powerplants_filter: '(DateOut > 2035 or DateOut != DateOut) and (DateIn <= 2035 or DateIn != DateIn)'
transmission_projects:
  enable: true
  reference_year: 2035
  include:
    tyndp2020: false
    tyndp2026: true
    nep: false
    manual: false
  # The committed subset has already been filtered to build_year <= 2035.
  status: [under_construction, in_permitting, planned_not_yet_permitted]
  new_link_capacity: keep
  skip: []
costs:
  year: 2035
  emission_prices:
    enable: false
    dynamic: false
conventional:
  dynamic_fuel_price: false
co2_budget:
  relative: true
  upper:
    2035: 0.25
  lower: null
clustering:
  mode: administrative
  administrative:
    level: bz
  build_bidding_zones:
    aggregate_to_tyndp: false
    remove_islands: false
  cluster_network:
    # Zone polygons determine the count; n_clusters is not a k-means target here.
    allow_ac_dc_mixing_in_bus_clusters: true
  copperplate_regions:
    - [DE00, LUG1]
    - [IE00, GBNI]
  temporal:
    averaging: false
    segmentation: false
    representative: false
renewable:
  onwind:
    resource_classes: 3
  offwind-ac:
    resource_classes: 3
  offwind-dc:
    resource_classes: 3
  solar:
    resource_classes: 3
energy_islands:
  enabled: false
  case: hybrid
  hubs: data/energy_islands/bornholm_hubs.csv
  wind: data/energy_islands/bornholm_wind.csv
  links: data/energy_islands/bornholm_links.csv
  # Reserved in ALL scenarios, including baseline; assets are enabled separately.
  project_area: data/energy_islands/bornholm_area.geojson
  exclude_project_area: true
  profile_mode: project
  profile_technology: offwind-ac
  collection_length_factor: 1.0
  subtract_generic_potential: false
  length_factor: 1.25
solving:
  options:
    rolling_horizon: false
    noisy_costs: false
    # Keep the agreed AC formulation; DC uses native sector efficiencies.
    transmission_losses: 0
  solver:
    name: gurobi
    options: gurobi-bornholm
  solver_options:
    gurobi-bornholm:
      threads: 16
      method: 6
      crossover: 0
      Seed: 123
  mem_mb: 110000
  runtime: 24h

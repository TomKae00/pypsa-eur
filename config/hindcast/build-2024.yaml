# Annual overlay: use after config/hindcast/build.yaml in --configfile.
# Independent overnight case; native scenarios cannot change planning_horizons.
run:
  name: hindcast-corrected-2024
  scenarios:
    enable: false
planning_horizons:
- 2024
snapshots:
  start: '2024-01-01'
  end: '2025-01-01'
  inclusive: left
load:
  fixed_year: 2024
electricity:
  powerplants_filter: (DateOut >= 2024 or DateOut != DateOut) and (DateIn <= 2024
    or DateIn != DateIn)
  estimate_renewable_capacities:
    year: 2024
atlite:
  default_cutout: europe-2024-era5
  cutouts:
    europe-2024-era5:
      module: era5
      x:
      - -12.0
      - 42.0
      y:
      - 33.0
      - 72.0
      dx: 0.3
      dy: 0.3
      time:
      - '2024'
      - '2024'
      chunks:
        time: 500
      prepare_kwargs:
        monthly_requests: true

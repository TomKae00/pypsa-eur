# Main case: full European study network, reported by historical bidding zone.
# The country-level archived solution has its own benchmark-reference.yaml.
year: 2023  # default for single-year commands; override with --year
years: [2022, 2023, 2024, 2025]
summary_output: results/hindcast-europe-zonal
network: results/hindcast-corrected-{year}/network.nc
bus_zones: data/hindcast/bus_zones_{year}.csv
zone_aliases: config/hindcast/zone-aliases.yaml
# Multiple buses in a market zone must be natively copperplated and agree in price.
price_mode: common
price_atol: 0.01  # EUR/MWh, absolute solver tolerance for a common market price
price_rtol: 0.000001
prices: data/hindcast/prices_zonal_{year}.csv
loads: null
output: results/hindcast-europe-zonal-{year}
expected_countries: [AL, AT, BA, BE, BG, CH, CZ, DE, DK, EE, ES, FI, FR, GB, GR, HR, HU, IE, IT, LT, LU, LV, ME, MK, NL, 'NO', PL, PT, RO, RS, SE, SI, SK, XK]
required_zones: [DE_LU, IE_SEM, DK_1, DK_2, NO_1, NO_2, NO_3, NO_4, NO_5, SE_1, SE_2, SE_3, SE_4]
# Native island regions remain separate in the optimisation and raw model outputs.
# These labels are model IDs, not ENTSO-E price-area/query codes. No mainland proxy.
# Explicitly unscored prices, spreads and optional historical flows involving them.
model_only_regions:
  ESMA: "Mallorca: no matching historical price-area series configured"
  FR15: "Corsica: no matching historical price-area series configured"
  GBZE: "Shetland: no matching historical price-area series configured"
# All electricity buses must be mapped; all inter-zone Lines/DC Links are included.
# Spreads and border directions are derived from those same connections.
flows: null
flow_kind: physical
min_aggregate_coverage: 1.0

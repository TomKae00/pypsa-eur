# Main case: full European study network, reported by historical bidding zone.
# The country-level archived solution has its own benchmark-reference.yaml.
year: 2023
network: results/hindcast-build-2023/network.nc
bus_zones: data/hindcast/bus_zones_2023.csv
prices: data/hindcast/prices_zonal_2023.csv
loads: null
output: results/hindcast-europe-zonal-2023
expected_countries: [AL, AT, BA, BE, BG, CH, CZ, DE, DK, EE, ES, FI, FR, GB, GR, HR, HU, IE, IT, LT, LU, LV, ME, MK, NL, 'NO', PL, PT, RO, RS, SE, SI, SK, XK]

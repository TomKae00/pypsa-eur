run:
  name: all
  scenarios:
    enable: true
    file: config/scenarios_bornholm_smoke.yaml
foresight: overnight
planning_horizons:
- 2035
sector:
  enabled: false
clustering:
  cluster_network:
    n_clusters: 20
  temporal:
    averaging: 6h
energy_islands:
  enabled: false
  case: hybrid
  hubs: data/energy_islands/bornholm_hubs.csv
  wind: data/energy_islands/bornholm_wind.smoke.csv
  links: data/energy_islands/bornholm_links.smoke.csv
  subtract_generic_potential: true
  length_factor: 1.25
  # IDs depend on this configuration's clustering; inspect its baseline first.
  potential_allocation: {}
  potential_allocation_notes: {}
solving:
  solver:
    name: highs
    options: highs-default
countries:
- DK
- DE
- SE
- PL

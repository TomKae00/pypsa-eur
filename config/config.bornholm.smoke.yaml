run:
  name: all
  scenarios:
    enable: true
    file: config/scenarios_bornholm_smoke.yaml
foresight: overnight
planning_horizons:
- 2035
sector:
  enabled: false
clustering:
  cluster_network:
    n_clusters: 20
  temporal:
    averaging: 6h
energy_islands:
  enabled: false
  case: hybrid
  hubs: data/energy_islands/bornholm_hubs.csv
  wind: data/energy_islands/bornholm_wind.smoke.csv
  links: data/energy_islands/bornholm_links.smoke.csv
  # Reserved in ALL scenarios, including baseline; assets are enabled separately.
  project_area: data/energy_islands/bornholm_area.geojson
  exclude_project_area: true
  profile_mode: project
  profile_technology: offwind-ac
  collection_length_factor: 1.0
  subtract_generic_potential: false
  length_factor: 1.25
solving:
  solver:
    name: highs
    options: highs-default
countries:
- DK
- DE
- SE
- PL

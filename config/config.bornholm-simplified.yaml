# Isolated, simplified Bornholm baseline benchmark.
# Layer AFTER config/config.bornholm.yaml.
# Same 2035 hourly weather, bidding zones, electrical transmission,
# renewable resource classes, generation and sector-demand assumptions.
# This run intentionally tests simplified non-electric infrastructure.
run:
  name: bornholm_simplified_baseline
  scenarios:
    enable: false
  shared_resources:
    policy: false

energy_islands:
  enabled: false

sector:
  # EU-wide CO2 pooling instead of region-level transport/storage.
  # WARNING: co2_spatial=false also removes the electric input on the
  # industrial process-emissions capture link in this code revision.
  # Treat as an alternative model assumption, not an equivalent baseline.
  co2_spatial: false
  co2_network: false
  regional_co2_sequestration_potential:
    enable: false
  # Keep the default global 2035 sequestration limit of 100 MtCO2/year
  # in sector.co2_sequestration_potential; solve_network adds it.

  # Remove secondary conversion pathways and solar heat generators.
  methanation: false
  hydrogen_fuel_cell: false
  solar_thermal: false

  # Explicitly preserve electricity-relevant flexible technologies.
  v2g: true
  hydrogen_turbine: true
  tes: true
  gas_network: true
  H2_network: false
  H2_retrofit: false

# No solver changes: benchmark model formulation against the original PDHG run.

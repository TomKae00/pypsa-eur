# One additional central Hybrid feasibility/memory test; layer AFTER 2035 config.
run:
  prefix: bornholm_2035_full_sector_v1
  name: [central_hybrid]
  shared_resources:
    policy: false
data:
  swiss_energy_balances:
    # Native archived 2024 workbook; the live URL now serves a revised layout.
    source: archive
    version: '2025-10-01'
sector:
  H2_network: true
  H2_retrofit: true
  shipping: true
  aviation: true
  # Already enabled by native defaults; pin explicitly for this diagnostic.
  co2_spatial: true
  co2_network: true
solving:
  solver_options:
    gurobi-calibrated-base:
      # Recomputed from MemAvailable AFTER Linopy model construction.
      SoftMemLimit: 210
